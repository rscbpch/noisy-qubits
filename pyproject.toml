[project]
name = "noisy-qubits"
version = "0.1.0"
description = "How much noise can quantum algorithms take? Qiskit notebooks + website."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "numpy",
    "pylatexenc",
    "qiskit-ibm-runtime>=0.52.1",
]

[dependency-groups]
dev = ["jupyterlab", "nbconvert", "nbformat", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noisy_qubits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
